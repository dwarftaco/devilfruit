    <body>
        <header>
            <div class="title">
                <img src="assets/images/logo.svg" alt="logo"/>
                <h1>DevilFruit.io</h1>
            </div>
            <nav>
                <ul>
                    <li><a class="current" href="index.html">Random</a></li>
                    <li><a href="encyclopedia.html">Encyclopedia</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="transparent">
                <h1>Claim your devil fruit</h1>
                <div class="filter">
                    <div class="dropdown">
                        <button
                                class="dropdown-button"><div class="label">Type</div><img
                                src="assets/images/arrow.svg" alt="arrow"/></button>
                        <div class="dropdown-content">
                            <a class="dropdown-item">
                                <input id="filter-type-paramecia" type="checkbox" checked="checked"/>
                                <span class="checkbox-label">Paramecia</span>
                            </a>
                            <a class="dropdown-item">
                                <input id="filter-type-zoan" type="checkbox" checked="checked"/>
                                <span class="checkbox-label">Zoan</span>
                            </a>
                            <a class="dropdown-item">
                                <input id="filter-type-logia" type="checkbox" checked="checked"/>
                                <span class="checkbox-label">Logia</span>
                            </a>
                        </div>
                    </div>
                    <div class="dropdown">
                        <button
                                class="dropdown-button"><div class="label">Source</div><img
                                src="assets/images/arrow.svg" alt="arrow"/></button>
                        <div class="dropdown-content">
                            <a class="dropdown-item">
                                <input id="filter-source-canon" type="checkbox" checked="checked"/>
                                <div class="checkbox-label">Canon</div>
                            </a>
                            <a class="dropdown-item">
                                <input id="filter-source-spoiler" type="checkbox"/>
                                <div class="checkbox-label">Spoiler</div>
                            </a>
                        </div>
                    </div>
                </div>
                <button onclick="randomDevilFruit()">Take A Bite</button>
                <div id="devil-fruit-card" class="card" style="display: none;">
                    <img id="devil-fruit-img" onerror="this.src='assets/images/unknown_0.svg'">
                    <h1 id="devil-fruit-name"></h1>
                    <h2 id="devil-fruit-type"></h2>
                    <p id="devil-fruit-desc"></p>
                </div>
            </section>
        </main>
        <footer>
            <p>&#169; 2025 DevilFruit.io</p>
        </footer>
    </body>
